[project]
name = "car-spotter-backend"
version = "0.1.0"
description = "FastAPI backend that identifies cars from photos using AI vision models."
requires-python = ">=3.11"

[tool.pytest.ini_options]
# Lets tests `import app...` without installing the package.
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
